# Access log: one JSON object per line on stdout (the official nginx image links
# /var/log/nginx/access.log to stdout). The URL is logged without its query string. "xForwardedFor" is the
# client address added by a load balancer or gateway in front; "remoteAddr" is the address nginx saw.
log_format json_access escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"service":"ui-nginx",'
        '"remoteAddr":"$remote_addr",'
        '"xForwardedFor":"$http_x_forwarded_for",'
        '"httpMethod":"$request_method",'
        '"httpPath":"$uri",'
        '"httpStatus":$status,'
        '"bytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"traceparent":"$http_traceparent",'
        '"requestId":"$request_id"'
    '}';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log json_access;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Security headers. add_header in a location replaces these, so each
    # location below that sets its own header repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Load balancer health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets/, so it can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Product photos baked into this image (see public/photos). Cached for a week; replace a file by changing its name or waiting it out.
    location /photos/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Everything else is the single-page app, so deep links like /products work.
    # index.html must never be cached, or a new deploy would not reach browsers.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
