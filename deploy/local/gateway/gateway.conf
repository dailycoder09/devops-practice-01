# Local stand-in for the AWS Application Load Balancer.
# Same path rules as the ALB, with two "VMs" (a and b) behind each target group.
#
#   ALB rule                      nginx equivalent
#   priority 10  /api/products*   location /api/products
#   priority 20  /api/inventory*  location /api/inventory
#   priority 30  /api/users*      location /api/users
#   priority 40  /api/cart*       location /api/cart
#   priority 50  /api/orders*     location /api/orders
#   default      everything else  location /
#
# Requests alternate between the two backends (round robin), like the ALB spreading
# requests across the registered targets of one target group.
# max_fails/fail_timeout approximate the ALB health check: a backend that refuses
# connections is skipped for 10 seconds.
#
# The user, cart and order target groups have ONE backend only: every container has its own H2 file, so
# two user containers would not share accounts and a login would fail at random, two cart containers
# would hold different carts and two order containers would know different orders.

# Access log: one JSON object per line on stdout (the official nginx image links
# /var/log/nginx/access.log to stdout). "xForwardedFor" is what the caller sent, "remoteAddr" is the
# address nginx really saw. "traceId" is the id the service answered with (header X-Trace-Id), so a
# gateway line can be matched to the service logs; "traceparent" is what the caller sent in.
# The URL is logged without its query string (queries can carry personal data).
log_format json_access escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"service":"gateway-nginx",'
        '"remoteAddr":"$remote_addr",'
        '"xForwardedFor":"$http_x_forwarded_for",'
        '"httpMethod":"$request_method",'
        '"httpPath":"$uri",'
        '"httpStatus":$status,'
        '"bytesSent":$body_bytes_sent,'
        '"requestTimeSeconds":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstreamResponseTime":"$upstream_response_time",'
        '"traceId":"$sent_http_x_trace_id",'
        '"traceparent":"$http_traceparent",'
        '"requestId":"$request_id"'
    '}';

upstream product_tg {
    server product-a:8081 max_fails=1 fail_timeout=10s;
    server product-b:8081 max_fails=1 fail_timeout=10s;
}

upstream inventory_tg {
    server inventory-a:8082 max_fails=1 fail_timeout=10s;
    server inventory-b:8082 max_fails=1 fail_timeout=10s;
}

upstream user_tg {
    server user:8083 max_fails=1 fail_timeout=10s;
}

upstream cart_tg {
    server cart:8084 max_fails=1 fail_timeout=10s;
}

upstream order_tg {
    server order:8085 max_fails=1 fail_timeout=10s;
}

upstream ui_tg {
    server ui-a:8080 max_fails=1 fail_timeout=10s;
    server ui-b:8080 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;

    access_log /var/log/nginx/access.log json_access;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location /api/products {
        proxy_pass http://product_tg;
    }

    location /api/inventory {
        proxy_pass http://inventory_tg;
    }

    location /api/users {
        proxy_pass http://user_tg;
    }

    location /api/cart {
        proxy_pass http://cart_tg;
    }

    location /api/orders {
        proxy_pass http://order_tg;
    }

    location / {
        proxy_pass http://ui_tg;
    }
}
