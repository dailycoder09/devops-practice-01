# Used by the tests that run with @ActiveProfiles("test").
# Own in-memory database per Spring context, and test-only security values (never used outside the tests).
spring:
  datasource:
    url: jdbc:h2:mem:cartdb-${random.uuid};DB_CLOSE_DELAY=-1
  jpa:
    show-sql: false

app:
  security:
    jwt:
      secret: test-only-secret-for-cart-service-tests-0123456789-abcdefghij
