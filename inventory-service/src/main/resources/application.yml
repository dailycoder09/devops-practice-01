spring:
  application:
    name: inventory-service

  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: jdbc:h2:file:${DB_FILE_PATH:./data/inventorydb};AUTO_SERVER=TRUE
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # Connection Pool Configuration
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: InventoryServiceHikariCP

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # H2 console is a known RCE vector (CVE-2021-42392) when reachable - keep it off
  h2:
    console:
      enabled: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: "classpath:db/migration/common,classpath:db/migration/{vendor}"

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port: 8082
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Trace ids for the logs and for the calls to other services. Nothing is exported (no Zipkin, no OTLP).
  tracing:
    sampling:
      probability: 1.0

# Logging Configuration
# Format, JSON file and appenders are in logback-spring.xml. Only the levels are here.
# Never log SQL parameter values: the SQL loggers are only switched on in the dev profile (below), and the binder stays at INFO.
logging:
  level:
    root: INFO
    com.microservices: INFO
    org.springframework.web: INFO
    org.hibernate: INFO

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  show-actuator: true

# Application Specific Configuration
application:
  name: Inventory Service
  version: 1.0.0
  description: Inventory Management Microservice
  api:
    version: v1
    base-path: /api/inventory
  pagination:
    default-page-size: 20
    max-page-size: 100

# JWT security: user-service signs the login tokens, this service only checks them.
# All services share one secret (environment variable JWT_SECRET, at least 32 bytes). Never commit a real secret.
# Outside the dev profile the service refuses to start when JWT_SECRET is missing or is the dev placeholder.
app:
  logging:
    # false = the user's email is left out of the logs (it is personal data); the user id and role stay
    include-email: true
    # a request slower than this is logged at WARN with slow=true
    slow-request-ms: 2000
  security:
    jwt:
      secret: ${JWT_SECRET:}

# Inventory Service specific configuration
inventory:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

# Server details endpoint: AWS EC2 instance metadata lookup (IMDSv2). Fails fast and quietly off-AWS.
server-info:
  cloud-metadata:
    enabled: ${CLOUD_METADATA_ENABLED:true}
    url: ${CLOUD_METADATA_URL:http://169.254.169.254}
    timeout-ms: 500

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    # SQL is written by the logger org.hibernate.SQL (below), not printed on the console
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    jwt:
      # Local development only: a labelled placeholder so a local run needs no set-up. Do not use in AWS.
      secret: ${JWT_SECRET:dev-only-placeholder-secret-do-not-use-in-aws-0123456789}

logging:
  level:
    com.microservices: DEBUG
    # INFO, not DEBUG: at DEBUG Spring MVC writes the (cut) request body into the log
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    # these two would write the values of the SQL parameters: they must stay at INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.hibernate.orm.jdbc.bind: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:h2:file:/data/inventorydb;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.springframework.web: WARN

management:
  endpoint:
    health:
      show-details: when-authorized

---
# Every profile except dev: stdout carries only the JSON log lines, so no start-up banner
spring:
  config:
    activate:
      on-profile: "!dev"
  main:
    banner-mode: "off"
